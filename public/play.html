<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PicoBox — Controle 🐱</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="pad-body">
  <div class="join-box" id="joinBox">
    <h1>🐱 PicoBox</h1>
    <p>Digite seu apelido e use o celular como controle na TV! (Melhor na horizontal 🔄)</p>
    <input id="nameInput" maxlength="14" placeholder="Seu apelido…" autocomplete="off" />
    <button class="join-btn" id="joinBtn">Entrar na Fase</button>
  </div>

  <div class="pad-top hidden" id="padTop">
    <div class="player-tag">
      <span class="color-dot" id="colorDot"></span>
      <span id="playerLabel">Jogador</span>
    </div>
    <button class="btn" id="padRestartBtn">↻ Reiniciar Fase</button>
  </div>

  <div class="pad-area hidden" id="padArea">
    <div class="dpad">
      <button class="ctrl-btn" id="btnLeft" aria-label="Esquerda">◀</button>
      <button class="ctrl-btn" id="btnRight" aria-label="Direita">▶</button>
    </div>
    <button class="ctrl-btn jump-btn" id="btnJump" aria-label="Pular">PULAR ⬆</button>
  </div>

  <script src="/play.js"></script>
</body>
</html>
